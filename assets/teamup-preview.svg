<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTeamUp" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="50%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#03050a"/>
    </linearGradient>
    <linearGradient id="gradCyanViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="gradOrangeAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#0d1322"/>
    </linearGradient>
    <linearGradient id="matchBadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" fill="url(#bgTeamUp)"/>

  <!-- Subtle Cyber Grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(56, 189, 248, 0.04)" stroke-width="1"/>
  </pattern>
  <rect width="800" height="500" fill="url(#grid)"/>

  <!-- Glowing background orbs -->
  <circle cx="160" cy="120" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glowCyan)"/>
  <circle cx="680" cy="380" r="160" fill="#818cf8" opacity="0.07" filter="url(#glowCyan)"/>

  <!-- Main App Window Frame -->
  <rect x="70" y="45" width="660" height="410" rx="16" fill="#0d1424" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.2"/>
  
  <!-- Window Header Bar -->
  <rect x="70" y="45" width="660" height="48" rx="16" fill="#131d31"/>
  <circle cx="98" cy="69" r="5" fill="#ef4444"/>
  <circle cx="113" cy="69" r="5" fill="#f59e0b"/>
  <circle cx="128" cy="69" r="5" fill="#10b981"/>
  
  <!-- Logo & Title in Header -->
  <rect x="155" y="58" width="22" height="22" rx="6" fill="url(#gradCyanViolet)"/>
  <text x="166" y="73" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="900" text-anchor="middle">T</text>
  <text x="186" y="74" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="13" font-weight="700">TeamUP</text>
  <text x="246" y="74" fill="#64748b" font-family="'Inter', sans-serif" font-size="12">/ Live Matchmaking Pool</text>

  <!-- Live Status Badge -->
  <rect x="580" y="58" width="130" height="24" rx="12" fill="rgba(34, 197, 94, 0.12)" stroke="rgba(34, 197, 94, 0.3)" stroke-width="1"/>
  <circle cx="595" cy="70" r="4" fill="#22c55e"/>
  <text x="606" y="74" fill="#4ade80" font-family="'Inter', sans-serif" font-size="11" font-weight="700">● LIVE POOL</text>

  <!-- Content Section: Left Column (Player Profile & Filters) -->
  <g transform="translate(95, 110)">
    <!-- Player Card -->
    <rect width="270" height="320" rx="14" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.2"/>
    
    <!-- Player Avatar & Name -->
    <circle cx="45" cy="45" r="22" fill="#1e293b" stroke="url(#gradCyanViolet)" stroke-width="2"/>
    <text x="45" y="50" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">⚡</text>
    
    <text x="78" y="40" fill="#ffffff" font-family="'Inter', sans-serif" font-size="14" font-weight="800">ShadowStriker</text>
    <text x="78" y="56" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Competitive Ranked • Unreal</text>

    <!-- Tag Pills -->
    <rect x="20" y="82" width="68" height="22" rx="6" fill="#1e293b"/>
    <text x="54" y="97" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">🌐 NA-East</text>

    <rect x="94" y="82" width="60" height="22" rx="6" fill="#1e293b"/>
    <text x="124" y="97" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" font-weight="600" text-anchor="middle">🎮 PC / KBM</text>

    <rect x="160" y="82" width="54" height="22" rx="6" fill="rgba(34, 197, 94, 0.15)" stroke="rgba(34, 197, 94, 0.4)" stroke-width="1"/>
    <text x="187" y="97" fill="#4ade80" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-anchor="middle">🎙️ Mic On</text>

    <!-- Criteria Specs -->
    <rect x="20" y="118" width="230" height="1" fill="rgba(255, 255, 255, 0.08)"/>
    
    <text x="20" y="142" fill="#64748b" font-family="'Inter', sans-serif" font-size="10" font-weight="700" text-transform="uppercase" letter-spacing="0.5">Looking for Squad / Duos</text>
    <text x="20" y="162" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Target: High kill games &amp; endgame focus</text>
    <text x="20" y="180" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Languages: English, Hindi</text>

    <!-- Match stats mini-box -->
    <rect x="20" y="200" width="230" height="52" rx="8" fill="#090e1a" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    <text x="35" y="222" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">KD RATIO</text>
    <text x="35" y="240" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="14" font-weight="800">4.82</text>
    
    <text x="110" y="222" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">WIN RATE</text>
    <text x="110" y="240" fill="#10b981" font-family="'Inter', sans-serif" font-size="14" font-weight="800">28.4%</text>

    <text x="185" y="222" fill="#64748b" font-family="'Inter', sans-serif" font-size="10">MATCHES</text>
    <text x="185" y="240" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="14" font-weight="800">1,240+</text>

    <!-- Connect Action Button -->
    <rect x="20" y="265" width="230" height="38" rx="8" fill="url(#gradCyanViolet)"/>
    <text x="135" y="289" fill="#070a14" font-family="'Inter', sans-serif" font-size="12" font-weight="800" text-anchor="middle">⚡ Send Squad Invite</text>
  </g>

  <!-- Content Section: Right Column (Real-time Matchmaking & Chat) -->
  <g transform="translate(385, 110)">
    <!-- Match Found Card -->
    <rect width="320" height="150" rx="14" fill="#111a2e" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2"/>
    
    <rect x="20" y="16" width="110" height="22" rx="11" fill="url(#matchBadgeGrad)"/>
    <text x="75" y="31" fill="#ffffff" font-family="'Inter', sans-serif" font-size="10" font-weight="800" text-anchor="middle">🎉 MATCH FOUND</text>
    <text x="140" y="32" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Compatibility 98%</text>

    <text x="20" y="65" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="13" font-weight="700">Vortex_Pro matched your request!</text>
    <text x="20" y="85" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Ranked Duos • NA-East • Voice Ready</text>

    <rect x="20" y="105" width="130" height="30" rx="6" fill="#1e293b" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    <text x="85" y="124" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11" font-weight="600" text-anchor="middle">View Stats</text>

    <rect x="160" y="105" width="140" height="30" rx="6" fill="#38bdf8"/>
    <text x="230" y="124" fill="#090d16" font-family="'Inter', sans-serif" font-size="11" font-weight="800" text-anchor="middle">Join Lobby ➔</text>

    <!-- In-App Live Chat Preview Box -->
    <g transform="translate(0, 165)">
      <rect width="320" height="155" rx="14" fill="#0e1526" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>
      
      <!-- Chat Header -->
      <rect width="320" height="34" rx="14" fill="#141e33"/>
      <circle cx="20" cy="17" r="4" fill="#22c55e"/>
      <text x="32" y="21" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="11" font-weight="700">Match Chat · Vortex_Pro</text>

      <!-- Message 1 -->
      <rect x="16" y="46" width="180" height="28" rx="8" fill="#1e293b"/>
      <text x="26" y="64" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="10">Yo! Ready for ranked tournaments?</text>

      <!-- Message 2 -->
      <rect x="114" y="80" width="190" height="28" rx="8" fill="rgba(56, 189, 248, 0.2)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1"/>
      <text x="124" y="98" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="10">Let's do it, sent party invite! 🔥</text>

      <!-- Chat input simulation -->
      <rect x="16" y="118" width="288" height="26" rx="6" fill="#090d16" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
      <text x="28" y="135" fill="#475569" font-family="'Inter', sans-serif" font-size="10">Type a message...</text>
    </g>
  </g>
</svg>
