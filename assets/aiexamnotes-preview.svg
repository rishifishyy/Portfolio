<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgExam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="aiBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgExam)"/>
  
  <!-- Subtle Matrix lines -->
  <line x1="100" y1="50" x2="100" y2="450" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="700" y1="50" x2="700" y2="450" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Main Note Generator Window -->
  <rect x="120" y="50" width="560" height="400" rx="20" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  
  <!-- Window Header Bar -->
  <rect x="120" y="50" width="560" height="50" rx="20" fill="#1f2937"/>
  <circle cx="150" cy="75" r="5" fill="#ef4444"/>
  <circle cx="165" cy="75" r="5" fill="#f59e0b"/>
  <circle cx="180" cy="75" r="5" fill="#10b981"/>
  <text x="210" y="80" fill="#94a3b8" font-family="sans-serif" font-size="13" font-weight="600">AI Exam Notes Generator • v1.0</text>
  <rect x="550" y="63" width="105" height="24" rx="12" fill="url(#aiBadge)"/>
  <text x="602" y="79" fill="#090d16" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">⚡ Gemini AI</text>

  <!-- Left Column: Syllabus Input -->
  <rect x="150" y="120" width="220" height="300" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="170" y="150" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">📄 Input Notes / Topic</text>
  <rect x="170" y="170" width="180" height="10" rx="5" fill="#334155"/>
  <rect x="170" y="190" width="150" height="10" rx="5" fill="#334155"/>
  <rect x="170" y="210" width="165" height="10" rx="5" fill="#334155"/>
  <rect x="170" y="230" width="130" height="10" rx="5" fill="#334155"/>

  <!-- Generate Button -->
  <rect x="170" y="360" width="180" height="40" rx="10" fill="url(#aiBadge)"/>
  <text x="260" y="385" fill="#090d16" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Generate Summary ➔</text>

  <!-- Right Column: AI Generated Flashcards & Summaries -->
  <rect x="395" y="120" width="260" height="300" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="415" y="150" fill="#10b981" font-family="sans-serif" font-size="12" font-weight="bold">✨ High-Yield Key Points</text>
  
  <!-- Flashcard 1 -->
  <rect x="415" y="170" width="220" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="430" y="192" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">1. Core Principles</text>
  <text x="430" y="212" fill="#94a3b8" font-family="sans-serif" font-size="10">Key exam formulas &amp; quick recap</text>

  <!-- Flashcard 2 -->
  <rect x="415" y="245" width="220" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="430" y="267" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="600">2. High-Probability Questions</text>
  <text x="430" y="287" fill="#94a3b8" font-family="sans-serif" font-size="10">AI-predicted viva &amp; short answers</text>

  <!-- Flashcard 3 -->
  <rect x="415" y="320" width="220" height="80" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
  <text x="430" y="345" fill="#a7f3d0" font-family="sans-serif" font-size="11" font-weight="bold">✅ Ready for Revision</text>
  <text x="430" y="365" fill="#6ee7b7" font-family="sans-serif" font-size="10">Export to PDF • One-click share</text>
</svg>
