<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgRS" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="wallGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bgRS)"/>
  <!-- 2D Canvas Grid on Left -->
  <rect x="30" y="40" width="350" height="420" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <circle cx="55" cy="65" r="5" fill="#ef4444"/>
  <circle cx="70" cy="65" r="5" fill="#f59e0b"/>
  <circle cx="85" cy="65" r="5" fill="#10b981"/>
  <text x="120" y="69" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="600">2D Floor Plan Canvas</text>
  
  <!-- Architectural Floor Plan Lines -->
  <line x1="70" y1="120" x2="330" y2="120" stroke="#64748b" stroke-width="4"/>
  <line x1="70" y1="120" x2="70" y2="380" stroke="#64748b" stroke-width="4"/>
  <line x1="330" y1="120" x2="330" y2="380" stroke="#64748b" stroke-width="4"/>
  <line x1="70" y1="380" x2="330" y2="380" stroke="#64748b" stroke-width="4"/>
  <line x1="70" y1="260" x2="230" y2="260" stroke="#38bdf8" stroke-width="4"/>
  <line x1="230" y1="120" x2="230" y2="260" stroke="#38bdf8" stroke-width="4"/>
  <!-- Dimensions and Door Arc -->
  <path d="M 230 260 A 40 40 0 0 1 270 300" stroke="#38bdf8" stroke-dasharray="3 3" fill="none" stroke-width="2"/>
  <text x="90" y="200" fill="#38bdf8" font-family="monospace" font-size="11">Living Room 18'x14'</text>
  <text x="90" y="320" fill="#94a3b8" font-family="monospace" font-size="11">Master Suite</text>

  <!-- Split Divider Sync Arrow -->
  <circle cx="400" cy="250" r="22" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
  <path d="M392 250 L408 250 M403 245 L408 250 L403 255" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 3D Live Viewport on Right -->
  <rect x="420" y="40" width="350" height="420" rx="16" fill="#0b1120" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="445" cy="65" r="5" fill="#38bdf8"/>
  <text x="465" y="69" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="bold">Live 3D Perspective [Sync 60fps]</text>
  
  <!-- Isometric 3D Room Mockup -->
  <polygon points="600,120 730,190 600,260 470,190" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="470,190 600,260 600,380 470,310" fill="#0f172a" stroke="#475569" stroke-width="2"/>
  <polygon points="600,260 730,190 730,310 600,380" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <!-- 3D Furniture Cube -->
  <polygon points="560,250 610,225 640,240 590,265" fill="#38bdf8" opacity="0.8"/>
  <!-- Ambient Walk-mode HUD -->
  <rect x="450" y="400" width="140" height="30" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="520" y="420" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">⚡ Walk Mode: Active</text>
</svg>
