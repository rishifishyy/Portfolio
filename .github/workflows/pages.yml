name: Refresh activity and deploy portfolio

on:
  push:
    branches: [main]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test activity handling
        run: node --test tests/*.test.js
      - name: Restore latest saved activity
        uses: actions/cache/restore@v4
        with:
          path: data/coding-activity.json
          key: coding-activity-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: coding-activity-v1-
      - name: Refresh public coding activity
        id: refresh
        continue-on-error: true
        run: node activity-service.js
      - name: Report upstream failure
        if: steps.refresh.outcome == 'failure'
        run: echo '::warning::A coding platform could not be refreshed. Saved activity remains available with its original timestamp.'
      - name: Save activity for the next refresh
        uses: actions/cache/save@v4
        with:
          path: data/coding-activity.json
          key: coding-activity-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Prepare static website
        run: |
          mkdir -p _site/data
          cp index.html style.css script.js appearance.css appearance.js snake-score-client.js portfolio-data.js activity-calendar.js _site/
          cp -r assets _site/assets
          cp data/coding-activity.json _site/data/
          cp Rishi_Nehra_Resume.tex _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
